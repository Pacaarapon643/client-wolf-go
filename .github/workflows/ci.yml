name: Go CI

on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  
jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout โค้ด
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. Setup Go
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'  # ใช้เวอร์ชันที่คุณใช้
    
    # 3. Cache dependencies (เร็วขึ้น)
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    # 4. Download dependencies
    - name: Download dependencies
      run: go mod download
    
    # 5. Run Tests
    - name: Run tests
      run: go test -v ./...
    
    # 6. Run Linter (ถ้ามี)
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
    
    # 7. Build
    - name: Build
      run: go build -v ./cmd/server